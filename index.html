<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blooming Store</title>

    <meta
        name="description"
        content="Blooming Store — изделия ручной работы"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="home">

    <div class="leaf leaf--1">❧</div>
    <div class="leaf leaf--2">❧</div>
    <div class="leaf leaf--3">❧</div>
    <div class="leaf leaf--4">❧</div>

    <section class="hero">

        <div class="hero__image" id="hero-image"></div>

        <div class="hero__overlay"></div>

        <div class="hero__content">

            <p class="hero__eyebrow" id="hero-eyebrow">
                handmade with love
            </p>

            <h1 class="hero__title" id="hero-title">
                Blooming<br>Store
            </h1>

            <p class="hero__subtitle" id="hero-subtitle">
                Изделия ручной работы
            </p>

            <p class="hero__description" id="hero-description"></p>

            <div class="hero__buttons">

                <a
                    href="catalog.html"
                    class="button button--primary"
                >
                    Посмотреть каталог
                </a>

                <a
                    href="#"
                    id="custom-order"
                    class="button button--secondary"
                >
                    Индивидуальный заказ
                </a>

                <a
                    href="#"
                    id="masterclasses"
                    class="button button--text"
                >
                    Мастер-классы от Blooming Store
                </a>

            </div>

        </div>

    </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
